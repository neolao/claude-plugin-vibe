schema_version: "1.1"
name: auto-leaves-no-trace-on-drained-backlog
description: >
  A fresh start on a backlog with nothing eligible (one item blocked, the
  other waiting on it): Step 0 must not open a run — no .vibe/auto-state.md,
  no `chore: auto run` commit, no sub-agent — and the report must say why
  nothing was eligible. Guards the /loop case where every firing on a drained
  backlog used to add an empty run and a commit. Needs --allow-tools Bash
  Write Edit to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
