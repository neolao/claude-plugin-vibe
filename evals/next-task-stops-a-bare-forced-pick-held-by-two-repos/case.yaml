schema_version: "1.1"
name: next-task-stops-a-bare-forced-pick-held-by-two-repos
description: >
  Forced pick of vibe:next-task at a workspace root with a bare number,
  `001`, that both active repos hold. Step 1 resolves a bare number to the
  one active repo holding it; with two, it must stop, name both repos and
  hand nothing off — not read one of the two items and present it as the
  pick. Needs --allow-tools Bash to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
