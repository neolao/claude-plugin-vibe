[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-worker"
version = "1.7.2"
description = "Renders invoices from the billing queue"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.28",
  "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
invoice-worker = "invoice_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
