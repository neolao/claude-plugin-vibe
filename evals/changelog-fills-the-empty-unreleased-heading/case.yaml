schema_version: "1.1"
name: changelog-fills-the-empty-unreleased-heading
description: >
  Precision side of changelog-inserts-the-missing-unreleased-heading: the
  `## [Unreleased]` heading is present and empty, exactly as /vibe:release
  leaves it. The same fix-then-feature history must be filed under that
  heading — one heading in the file, Added before Fixed, nothing appended
  below the released section. Needs --allow-tools Bash Write Edit to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
