services:
  nginx:
    image: nginx:1.27
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/portal:/etc/ssl:ro
    depends_on:
      - app
      - oauth2-proxy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    command:
      - --provider=oidc
      - --oidc-issuer-url=https://sso.example.com
      - --allowed-group=support
      - --http-address=0.0.0.0:4180
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${SSO_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${SSO_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${SSO_COOKIE_SECRET}

  app:
    build: ..
    command: flask --app app run --host 0.0.0.0 --port 5000
    environment:
      SECRET_KEY: ${PORTAL_SECRET_KEY}
    volumes:
      - portal-data:/var/data

  metrics:
    build: ..
    command: python3 metrics.py
    ports:
      - "127.0.0.1:9100:9100"

volumes:
  portal-data:
