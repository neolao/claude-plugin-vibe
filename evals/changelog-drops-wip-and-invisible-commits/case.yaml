schema_version: "1.1"
name: changelog-drops-wip-and-invisible-commits
description: >
  Since the last tag: a `wip: add PDF export (plan rejected)` commit with
  no follow-up, a `refactor:` from vibe:review that renames a local
  variable, a `test:` commit, and one real `fix:`. Only the fix may
  produce an entry — the wip matched the `add` keyword and used to
  announce a feature that does not exist. The sibling case
  changelog-counts-the-feature-that-finishes-a-wip is the precision side.
  Needs --allow-tools Bash Write Edit to run.
context:
