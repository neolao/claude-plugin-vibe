[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-api"
version = "3.2.0"
requires-python = ">=3.12"
dependencies = [
  "PyYAML==5.3",
  "click==8.1.7",
]

[project.scripts]
catalog-api = "catalog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
