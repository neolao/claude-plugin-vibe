services:
  nginx:
    image: nginx:1.27
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/portal:/etc/ssl:ro
    depends_on:
      - app

  app:
    build: ..
    command: flask --app app run --host 0.0.0.0 --port 5000
    environment:
      SECRET_KEY: ${PORTAL_SECRET_KEY}
    volumes:
      - portal-data:/var/data

  metrics:
    build: ..
    command: python3 metrics.py
    ports:
      - "127.0.0.1:9100:9100"

volumes:
  portal-data:
