schema_version: "1.1"
name: workspace-init-keeps-the-vision-on-refresh
description: >
  vibe:workspace-init refreshing a hub whose `CLAUDE.md` carries the
  vision paragraph written at bootstrap (under `## Role`, no `<!-- keep
  -->` marker). A new sibling is registered, the hub `CLAUDE.md` is
  rewritten, and the vision paragraph must still be there word for word
  — the old template dropped it on every refresh. Needs --allow-tools
  Bash,Write,Edit to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
