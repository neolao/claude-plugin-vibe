schema_version: "1.1"
name: changelog-classifies-plain-messages-by-keyword
description: >
  Precision side of changelog-classifies-by-prefix-over-keyword: a
  repository with no conventional commits at all. `Add dark mode …`,
  `Remove the legacy XML export`, `Patch the crash when a report has no
  rows` must land under Added, Removed and Fixed from their keywords, and
  `Fix typo in README` must produce nothing. Needs --allow-tools Bash
  Write Edit to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
