schema_version: "1.1"
name: release-refreshes-generated-docs-without-asking-about-the-readme
description: >
  vibe:release with no argument on a repo whose docs/ holds a file
  generated by vibe:docs and whose README has no managed section. The
  release must refresh docs/ (vibe:docs --full is invoked), answer in the
  user's place the question vibe:docs raises about which README sections
  to manage — none, the README stays byte-for-byte — and carry on to the
  tag in the same turn, with no question left in the report. Needs
  --allow-tools Bash,Write,Edit to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
