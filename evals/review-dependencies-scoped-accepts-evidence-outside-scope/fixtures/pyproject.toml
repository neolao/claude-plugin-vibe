[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-backoffice"
version = "1.4.0"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.27.0",
  "python-dateutil==2.9.0.post0",
  "tabulate==0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.0",
  "pytest-cov==5.0.0",
  "freezegun==1.5.1",
]

[tool.setuptools.packages.find]
include = ["orders*", "payments*", "reports*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=orders --cov=payments --cov-report=term-missing"
