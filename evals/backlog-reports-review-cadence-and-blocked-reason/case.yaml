schema_version: "1.1"
name: backlog-reports-review-cadence-and-blocked-reason
description: >
  Second list-mode case for vibe:backlog, on the branch the first one cannot
  reach: a blocked item's own reason plus the hint that re-running the skill
  puts it back in play. The fixture's .vibe/last-review.md is a legacy file
  from the former /vibe:review command; the skill must ignore it. Needs
  --allow-tools Bash,Write,Edit to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
