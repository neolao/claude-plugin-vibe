schema_version: "1.1"
name: review-tests-rates-by-what-ships-green
description: >
  A green unittest suite whose only test of net_pay, the critical logic
  CLAUDE.md names, patches net_pay itself and reads back the configured
  return value, and whose pay-slip label helper has an untested
  empty-name branch. The stub of the code under test must be rated high
  (a wrong net_pay ships green), the untested branch of the label helper
  medium (unverified, not critical). Needs --allow-tools Bash to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
