schema_version: "1.1"
name: changelog-scopes-to-a-pre-release-tag-without-a-final
description: >
  Precision twin of changelog-scopes-to-the-version-tag-among-other-tags.
  The repo is tagged v1.2.0, then the CSV export lands and is tagged
  v1.3.0-rc.1 with its own [1.3.0-rc.1] section; no v1.3.0 exists; then
  the PDF export lands. The pre-release rule (skip v1.3.0-rc.1 when
  v1.3.0 is also tagged) must not fire here: the range starts at
  v1.3.0-rc.1 and [Unreleased] gets the PDF export only, not the CSV
  export again. Needs --allow-tools Bash Write Edit to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
