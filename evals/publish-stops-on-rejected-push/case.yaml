schema_version: "1.1"
name: publish-stops-on-rejected-push
description: >
  vibe:publish stops at Step 1 when the push is rejected because origin
  moved ahead (a teammate pushed first): it reports the Git error as a
  blocker, never forces, never rebases on its own and never cuts a release
  on top of an unpushed state. The remote is a bare repo created inside the
  run workspace. Needs --allow-tools Bash,Write,Edit to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [fixtures]
