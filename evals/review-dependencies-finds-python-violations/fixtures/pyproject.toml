[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-builder"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
  "flask>=1.0",
  "PyYAML==5.3",
  "pycrypto==2.6.1",
  "beautifulsoup4==4.12.3",
  "python-dateutil==2.9.0.post0",
  "click==8.1.7",
  "pytest==8.2.0",
]

[project.optional-dependencies]
dev = ["freezegun==1.5.1"]

[tool.setuptools.packages.find]
where = ["src"]
