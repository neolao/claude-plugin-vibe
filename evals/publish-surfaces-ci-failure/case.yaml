schema_version: "1.1"
name: publish-surfaces-ci-failure
description: >
  vibe:publish's new Step 3 must find the GitHub Actions workflow run for
  the current commit, poll it to a conclusion, and surface a failed run as
  a first-class, loudly-reported blocker — not fold it silently into "push
  succeeded". Step 1/2 are pre-satisfied (nothing to push, empty changelog)
  so the run stays cheap and isolates Step 3. The sandbox has no real `gh`
  or network GitHub access, so `gh` is a local stand-in documented in the
  fixture's own CLAUDE.md (`./bin/gh`) — mocking fidelity is unverified by
  an actual `claude plugin eval` run; validate with --runs 1 first. Needs
  --allow-tools Bash,Write,Edit to run.
context:
  scaffold_script: fixture.sh
  add_dirs: [.]
